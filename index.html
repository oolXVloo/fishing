<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>낚시 게임</title>

<style>

body{
    margin:0;
    overflow:hidden;
    font-family:sans-serif;
    background:linear-gradient(#7dd3fc,#0284c7);
    color:white;
    text-align:center;
    touch-action: manipulation;
}

h1{
    margin-top:15px;
}

button{
    border:none;
    border-radius:16px;
    padding:14px 22px;
    font-size:18px;
    font-weight:bold;
    background:#ffd54f;
    color:#222;
    box-shadow:0 4px 10px rgba(0,0,0,0.3);
}

button:active{
    transform:scale(0.96);
}

#status{
    margin-top:10px;
    min-height:28px;
    font-size:20px;
}

#fishInfo{
    margin-top:8px;
    font-size:22px;
}

#timer{
    font-size:24px;
    margin-top:8px;
}

#moneyText{
    font-size:24px;
    margin-top:10px;
    font-weight:bold;
}

#regionText{
    font-size:22px;
    margin-top:8px;
    font-weight:bold;
}

.common{
    color:white;
}

.rare{
    color:#4ade80;
}

.legend{
    color:#facc15;
}

.myth{
    color:#a78bfa;
}

.trans{
    color:#fb7185;
}

#barBox{
    position:relative;
    width:90%;
    max-width:700px;
    height:40px;
    background:#222;
    border:3px solid white;
    border-radius:20px;
    margin:25px auto;
    overflow:hidden;
    display:none;
}

#fishZone{
    position:absolute;
    height:100%;
    background:rgba(0,255,120,0.7);
    border-radius:20px;
}

#pointer{
    position:absolute;
    width:14px;
    height:100%;
    background:#ff5252;
    box-shadow:0 0 10px red;
}

#catchBg{
    width:90%;
    max-width:700px;
    height:24px;
    margin:auto;
    background:#222;
    border:2px solid white;
    border-radius:20px;
    overflow:hidden;
    display:none;
}

#catchBar{
    width:0%;
    height:100%;
    background:
    linear-gradient(
        90deg,
        #00ff99,
        #00c853
    );
}

#controls{
    margin-top:20px;
    display:none;
}

#tapBtn{
    width:220px;
    height:80px;
    font-size:28px;
}

/* 기존 #menuButtons CSS 전체 교체 */

#menuButtons{
    position:fixed;
    bottom:0;
    left:0;

    width:100%;
    height:90px;

    background:
    rgba(0,0,0,0.22);

    backdrop-filter:blur(10px);

    display:grid;
    grid-template-columns:
    repeat(4,1fr);

    padding:10px;
    gap:10px;

    box-sizing:border-box;
}

/* 메뉴 버튼 */

.menuBtn{

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    border-radius:18px;

    background:
    linear-gradient(
        180deg,
        #ffffff,
        #d9d9d9
    );

    color:#222;

    font-size:13px;
    font-weight:bold;

    box-shadow:
    inset 0 2px 0 rgba(255,255,255,0.9),
    0 5px 10px rgba(0,0,0,0.25);

    transition:0.08s;
}

.menuBtn:active{

    transform:
    translateY(4px);

    box-shadow:
    inset 0 4px 8px rgba(0,0,0,0.25);

    background:
    linear-gradient(
        180deg,
        #d6d6d6,
        #bdbdbd
    );
}

.menuIcon{
    font-size:26px;
    margin-bottom:4px;
}

/* 하단 메뉴 때문에 공간 확보 */

body{
    padding-bottom:110px;
}

#inventoryBar{
    width:95%;
    max-width:700px;

    margin:20px auto;

    display:flex;
    justify-content:center;
    gap:10px;
}

.invSlot{
    width:70px;
    height:70px;

    background:
    rgba(0,0,0,0.35);

    border:3px solid white;
    border-radius:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:32px;
}

.invSlot.empty{
    opacity:0.4;
}

#popupBg{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);

    display:none;
    justify-content:center;
    align-items:center;

    z-index:999;
}

#popup{
    background:white;
    color:black;
    padding:20px;
    border-radius:20px;
    width:80%;
    max-width:400px;
    max-height:80vh;
    overflow:auto;
}

.panel{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);

    display:none;
    justify-content:center;
    align-items:center;

    z-index:999;
    overflow-y:auto;
}

.panel.active{
    display:flex;
}

.panelContent{
    background:white;
    color:black;
    padding:25px;
    border-radius:20px;
    width:85%;
    max-width:450px;
    max-height:85vh;
    overflow-y:auto;
    margin:20px 0;
}

.panelContent h2{
    margin-top:0;
    color:#333;
    border-bottom:2px solid #ddd;
    padding-bottom:12px;
}

.panelContent h3{
    color:#222;
    margin-top:15px;
}

.panelClose{
    float:right;
    font-size:28px;
    font-weight:bold;
    color:#666;
    cursor:pointer;
    width:30px;
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:#eee;
    transition:0.2s;
}

.panelClose:hover{
    background:#ddd;
    color:#000;
}

.questEntry{
    padding:15px;
    margin:10px 0;
    border-radius:12px;
    background:#f9f9f9;
    border-left:4px solid #4ade80;
    color:#222;
}

.questEntry.completed{
    border-left-color:#fbbf24;
    background:#fffbf0;
}

.questEntry.claimed{
    border-left-color:#10b981;
    background:#f0fdf4;
    opacity:0.7;
}

.questProgressBar{
    height:20px;
    background:linear-gradient(90deg, #4ade80, #22c55e);
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-weight:bold;
    font-size:12px;
    transition:width 0.3s;
    margin:8px 0;
}

.fishEntry{
    padding:8px;
    border-bottom:1px solid #ddd;
}

.regionEntry{
    padding:12px;
    margin:10px 0;
    border-radius:14px;
    background:#f2f2f2;
    color:black;
}

#startScreen{
    position:fixed;
    inset:0;

    background:
    linear-gradient(
        180deg,
        #38bdf8,
        #0369a1
    );

    display:flex;
    justify-content:center;
    align-items:center;

    z-index:9999;
}

#startPanel{
    width:85%;
    max-width:420px;

    padding:35px;

    border-radius:28px;

    background:
    rgba(255,255,255,0.12);

    backdrop-filter:blur(10px);

    box-shadow:
    0 10px 40px
    rgba(0,0,0,0.35);
}

#startPanel h1{
    font-size:48px;
    margin-bottom:10px;
}

.subText{
    font-size:20px;
    margin-bottom:30px;
    opacity:0.9;
}

#startPanel button{
    width:100%;
    margin-top:14px;
    font-size:24px;
    padding:18px;
}

#playBtn{
    background:#4ade80;
}

#continueBtn{
    background:#60a5fa;
    color:white;
}

#resetDataBtn{
    background:#ef5350;
    color:white;
}

footer{

    position:fixed;

    bottom:14px;
    left:50%;

    transform:
    translateX(-50%);

    width:80%;
    max-width:700px;

    padding:14px 20px;

    text-align:center;

    color:white;
    font-size:15px;
    font-weight:bold;

    background:
    rgba(0,0,0,0.32);

    backdrop-filter:
    blur(12px);

    border:
    1px solid rgba(255,255,255,0.18);

    border-radius:24px;

    box-shadow:
    0 8px 24px rgba(0,0,0,0.28);

    z-index:1000;
}

.tip{

    position:relative;
}

.tooltip{

    position:absolute;

    bottom:130%;
    left:50%;

    transform:
    translateX(-50%);

    padding:8px 12px;

    background:#111;
    color:white;

    border-radius:12px;

    font-size:14px;

    white-space:nowrap;

    opacity:0;
    pointer-events:none;

    transition:0.15s;
}

.tip:active .tooltip,
.tip:hover .tooltip{

    opacity:1;
}

</style>
</head>

<div id="status">

<div id="fishInfo"></div>

<div id="timer"></div>

</div>

<div id="catchBg">

</div>

<div id="controls">

    <button id="upgradeBtn">

</div>

<div id="popupBg">

</div>

<!-- 퀘스트 패널 -->
<div id="questPanel" class="panel">

        </div>
    </div>
</div>

<!-- 도감 패널 -->
<div id="bookPanel" class="panel">
    <div class="panelContent">
        <span class="panelClose" onclick="closePanel('bookPanel')">✕</span>
        <h2>📖 물고기 도감</h2>
        <div id="bookList"></div>
    </div>
</div>

<!-- 상점 패널 -->
<div id="shopPanel" class="panel">
    <div class="panelContent">
        <span class="panelClose" onclick="closePanel('shopPanel')">✕</span>
        <h2>🏪 낚싯대 상점</h2>

</div>

<!-- 물고기 상세 정보 패널 -->
<div id="fishDetailPanel" class="panel">

</div>

<!-- 낚싯대 업그레이드 패널 -->
<div id="upgradePanel" class="panel">

</div>

function getRod(){

    const baseRod = rods.find(
        r => r.id === currentRod
    );

    if(!baseRod) return rods[0];

    const level = getRodLevel(currentRod);
    const levelBonus = level - 1;
    
    // 레벨마다 5% 성능 향상
    const multiplier = 1 + (levelBonus * 0.05);

    return {
        ...baseRod,
        name: baseRod.name + ` LV.${level}`,
        pointerBoost: Math.round(baseRod.pointerBoost * multiplier),
        catchBonus: baseRod.catchBonus + (levelBonus * 0.02),
        greenBonus: Math.round(baseRod.greenBonus * multiplier),
        level: level
    };
}

function chooseEncounter(){

    // stage에 따른 물고기 풀 선택
    let stageFishes = fishes.filter(f => f.region === currentRegion);
    
    // stage가 높을수록 더 어려운 물고기 출현 확률 증가
    let normalFish = stageFishes.filter(f =>
        f.rarity === "일반" || f.rarity === "희귀"
    );
    let minibossFish = stageFishes.filter(f =>
        f.rarity === "전설"
    );
    let bossFish = stageFishes.filter(f =>
        f.rarity === "신화" || f.rarity === "초월"
    );

    let type = "normal";
    let fish;

    if(bossReady && bossFish.length > 0){
        type = "boss";
        fish = bossFish[Math.floor(Math.random() * bossFish.length)];
    }
    else if(minibossFish.length > 0 && Math.random() < (0.15 + stage * 0.05)){
        type = "miniboss";
        fish = minibossFish[Math.floor(Math.random() * minibossFish.length)];
    }
    else if(normalFish.length > 0){
        type = "normal";
        fish = normalFish[Math.floor(Math.random() * normalFish.length)];
    }
    else{
        type = "normal";
        fish = stageFishes[Math.floor(Math.random() * stageFishes.length)];
    }

    return {
        type: type,
        fish: fish
    };
}

function updateGame(){

    const rod = getRod();

    if(!holding){

        pointerPos -= rod.gravity;
    }

    pointerPos = Math.max(
        0,
        Math.min(
            barBox.clientWidth
            - rod.pointerSize,
            pointerPos
        )
    );

    const fishLeft = fishPos;

    const fishRight =
    fishPos
    + currentFish.size
    + rod.greenBonus;

    // 빨간 릴 전체 판정
    const pointerRight =
    pointerPos + rod.pointerSize;

    const touching =
    pointerRight >= fishLeft &&
    pointerPos <= fishRight;

    if(touching){

        catchProgress +=
        0.7 + rod.catchBonus;

    }else{

        catchProgress -= 0.5;
    }

    catchProgress = Math.max(
        0,
        Math.min(100, catchProgress)
    );

    if(catchProgress >= 100){

        winFish();
    }
    const rrod = getRod();

    nowrod.innerText =
    rrod.name;

    
    updateUI();
}

    const rod = getRod();

    const move =
    (Math.random()-0.5)
    * currentFish.speed
    * rod.fishSlow
    * 12;

    fishPos += move;

    

    const fishSize =
    currentFish.size
    + rod.greenBonus;

    fishPos = Math.max(
        0,
        Math.min(
            barBox.clientWidth
            - fishSize,
            fishPos
        )
    );
}

function buyRod(id){

    const rod =
    rods.find(r => r.id === id);

    const owned =
    ownedRods.includes(id);

    if(owned){

        currentRod = id;

        localStorage.setItem(
            "currentRod",
            currentRod
        );

        openRodShop();

        return;
    }

    const rodIndex =
    rods.findIndex(r =>
        r.id === id
    );

    const prevRod =
    rods[rodIndex - 1];

    if(!ownedRods.includes(prevRod.id)){

        alert(
        "이전 낚싯대를 먼저 구매하세요!"
        );

        return;
    }

    if(money < rod.price){

        alert("돈 부족!");

        return;
    }

    money -= rod.price;

    ownedRods.push(id);

    currentRod = id;

    localStorage.setItem(
        "money",
        money
    );

    localStorage.setItem(
        "ownedRods",
        JSON.stringify(ownedRods)
    );

    localStorage.setItem(
        "currentRod",
        currentRod
    );

    updateMoney();

    openRodShop();
}

    switch(rarity){

        case "희귀":

    }
}

        money += currentFish.price * 3;

        addQuestProgress("catch");
        if(currentFish.rarity === "희귀" || currentFish.rarity === "전설" || 
           currentFish.rarity === "신화" || currentFish.rarity === "초월"){
            addQuestProgress("rare");
        }
        if(currentFish.rarity === "전설"){
            addQuestProgress("legend");
        }
        
        localStorage.setItem("money", money);
        localStorage.setItem("stage", stage);
        localStorage.setItem("minibossCount", minibossCount);
        localStorage.setItem("bossReady", String(bossReady));
        
        setTimeout(resetGame, 2000);
    }
    else if(currentEncounter.type === "miniboss"){
        // 중간보스 처치
        minibossCount++;
        
        money += currentFish.price * 2;
        
        const target = getMinibossTarget(stage);
        if(minibossCount >= target){
            bossReady = true;
            statusText.innerText =
            "👹 " + currentFish.name + " 처치! 보스 도전 가능!";
        } else {
            statusText.innerText =
            "👹 " + currentFish.name + " 처치! (중간보스 " + minibossCount + "/" + target + ")";
        }
        
        updateMoney();
        updateStageUI();
        
        addQuestProgress("catch");
        if(currentFish.rarity === "희귀" || currentFish.rarity === "전설" || 
           currentFish.rarity === "신화" || currentFish.rarity === "초월"){
            addQuestProgress("rare");
        }
        if(currentFish.rarity === "전설"){
            addQuestProgress("legend");
        }
        
        localStorage.setItem("money", money);
        localStorage.setItem("minibossCount", minibossCount);
        localStorage.setItem("bossReady", String(bossReady));
        
        setTimeout(resetGame, 2000);
    }
    else {
        // 일반 물고기 포획
        addQuestProgress("catch");

        if(
            currentFish.rarity === "희귀" ||
            currentFish.rarity === "전설" ||
            currentFish.rarity === "신화" ||
            currentFish.rarity === "초월"
        ){
            addQuestProgress("rare");
        }

        if(
            currentFish.rarity === "전설"
        ){
            addQuestProgress("legend");
        }

        inventory.push(currentFish);
        
        money += currentFish.price;

        localStorage.setItem(
            "fishInventory",
            JSON.stringify(inventory)
        );
        
        localStorage.setItem("money", money);

        renderInventory();
        updateMoney();

        statusText.innerText =
        currentFish.name +
        " 획득!";

        setTimeout(resetGame,1500);
    }
}

function loseFish(){

    stopGame();

    statusText.innerText =
    "물고기가 도망갔다...";

    setTimeout(resetGame,2000);
}

function stopGame(){

    clearInterval(gameLoop);
    clearInterval(fishLoop);
    clearInterval(timerLoop);

    controls.style.display = "none";
}

function resetGame(){

    startBtn.style.display =
    "inline-block";

    barBox.style.display = "none";

    catchBg.style.display = "none";

    fishInfo.innerText = "";

    timerText.innerText = "";

    statusText.innerText =
    "다시 낚시할 준비 완료!";
}

function renderInventory(){

    inventoryBar.innerHTML = "";

    for(let i=0;i<5;i++){

        const slot =
        document.createElement("div");

        slot.className =
        "invSlot";

        const fish =
        inventory[i];

        if(fish){

            slot.innerText =
            fish.name.split(" ")[0];

            slot.onclick = () => {

                inventoryFish = fish;

                openCatchMenu(i);
            };

        }else{

            slot.classList.add("empty");

            slot.innerText = "➕";
        }

        inventoryBar.appendChild(slot);
    }
}

function openCatchMenu(index){

    showPanel("fishDetailPanel");

    const donated =
    collection.includes(
        inventoryFish.name
    );

    let html = `
        <h3>${inventoryFish.name}</h3>
        <p style="margin:10px 0;"><b>희귀도:</b> <span class="${rarityClass(inventoryFish.rarity)}">${inventoryFish.rarity}</span></p>
        <p style="margin:10px 0;"><b>판매 가격:</b> 💰 ${inventoryFish.price}G</p>
        
        <button onclick="sellFish(${index})" style="background:#60a5fa; color:white; padding:10px 20px; border:none; border-radius:8px; cursor:pointer; width:100%; margin:15px 0;">
            💰 판매하기
        </button>
    `;

    if(donated){
        html += `<button disabled style="background:#ccc; color:#666; padding:10px 20px; border:none; border-radius:8px; width:100%; margin:15px 0; cursor:not-allowed;">📖 이미 도감 등록됨</button>`;
    } else {
        html += `<button onclick="donateFish(${index})" style="background:#4ade80; color:white; padding:10px 20px; border:none; border-radius:8px; cursor:pointer; width:100%; margin:15px 0;">📖 도감 기증</button>`;
    }

    document.getElementById("fishDetailTitle").textContent = inventoryFish.name;
    document.getElementById("fishDetailContent").innerHTML = html;
}

function donateFish(index){
    //퀘스트 달성/////////////////////////////////////////////////////////////////////////
    addQuestProgress("donate");
    collection.push(
        inventoryFish.name
    );

    localStorage.setItem(
        "fishCollection",
        JSON.stringify(collection)
    );

    inventory.splice(index,1);

    localStorage.setItem(
        "fishInventory",
        JSON.stringify(inventory)
    );

    renderInventory();

    closePanel("fishDetailPanel");

    statusText.innerText = "✓ 도감에 등록되었습니다!";
}

function sellFish(index){
    //퀘스트 달성//////////////////////////////////////////////////////////////////////////////////////////////
    addQuestProgress("sell");

    money += inventoryFish.price;

    localStorage.setItem(
        "money",
        money
    );

    inventory.splice(index,1);

    localStorage.setItem(
        "fishInventory",
        JSON.stringify(inventory)
    );

    renderInventory();

    updateMoney();

    closePanel("fishDetailPanel");
    
    statusText.innerText = "💰 판매되었습니다!";
}

function closePopup(){

    // Legacy function - 더 이상 사용 안 함
}

bookBtn.onclick = () => {

    showPanel("bookPanel");

    let html = "";

    fishes.forEach(fish => {

        const owned =
        collection.includes(fish.name);

        html += `
        <div class="fishEntry">
            ${owned ? fish.name : "❓ 미발견 물고기"}

};

shopBtn.onclick =
openRodShop;



function openRodShop(){

    showPanel("shopPanel");

    let html = "";

    rods.forEach((rod,index) => {

        const owned =
        ownedRods.includes(
            rod.id
        );

        const equipped =
        currentRod === rod.id;

        const prevOwned =
        index === 0 ||
        ownedRods.includes(
            rods[index-1].id
        );

        html += `
        <div class="regionEntry">
            <h3>${rod.name}</h3>
            <p>💰 가격: ${rod.price}G</p>
            <p>⬆ 릴 상승: ${rod.pointerBoost}</p>
            <p>⬇ 릴 하강: ${rod.gravity}</p>
            <p>🟢 영역 증가: +${rod.greenBonus}</p>
        `;

        if(equipped){
            html += `<p style="color:#10b981; font-weight:bold;">✓ 장착중</p>`;
        }else if(owned){
            html += `<button onclick="buyRod('${rod.id}')" style="background:#60a5fa; color:white; padding:8px 16px; border:none; border-radius:8px; cursor:pointer;">장착</button>`;
        }else if(prevOwned){
            html += `<button onclick="buyRod('${rod.id}')" style="background:#4ade80; color:white; padding:8px 16px; border:none; border-radius:8px; cursor:pointer;">구매</button>`;
        }else{
            html += `<p style="color:#ff6b6b;">🔒 이전 낚싯대 필요</p>`;
        }

        html += `</div>`;
    });

    document.getElementById("shopList").innerHTML = html;
}

regionBtn.onclick = () => {

    popupBg.style.display = "flex";

    let html =
    "<h2>🗺 지역 이동</h2>";

    regions.forEach(region => {

        const unlocked =
        unlockedRegions.includes(
            region.name
        );

        html += `

        <div class="regionEntry">

        <h3>${region.name}</h3>

        <p>
        해금:
        ${region.unlockCost}G
        </p>

        배 값:
        ${region.travelCost}G
        </p>

        `;

        if(unlocked){

            if(region.name === currentRegion){

                html += `

                `;

                html += `

                travelRegion(

                </button>

                `;
            }

        }else{

            html += `

            <button onclick="
            unlockRegion(
            '${region.name}'

            </button>

            `;
        }

        `;
    });

    html += `

    `;

function unlockRegion(name){

    const region =
    regions.find(r =>
        r.name === name
    );

    if(money < region.unlockCost){

        alert("돈 부족!");

        return;
    }

    money -= region.unlockCost;

    unlockedRegions.push(name);

    localStorage.setItem(
        "money",
        money
    );

    localStorage.setItem(
        "unlockedRegions",
        JSON.stringify(
            unlockedRegions
        )
    );

    updateMoney();

    regionBtn.onclick();
}

function travelRegion(name){

    const region =
    regions.find(r =>
        r.name === name
    );

    if(money < region.travelCost){

        alert("배 값 부족!");

        return;
    }

    money -= region.travelCost;

    currentRegion = name;

    localStorage.setItem(
        "money",
        money
    );

    localStorage.setItem(
        "currentRegion",
        currentRegion
    );

    updateMoney();

    updateRegionText();

    closePopup();
}

function closePanel(panelId){
    const panel = document.getElementById(panelId);
    if(panel){
        panel.classList.remove("active");
    }
}

function showPanel(panelId){
    const panel = document.getElementById(panelId);
    if(panel){
        panel.classList.add("active");
    }
}

function getAllQuestCompleted(){
    return quests.every(q => {
        const progress = questProgress[q.id] || 0;
        return progress >= q.goal;
    });
}

function getRandomDailyBonus(){
    return dailyBonusRewards[Math.floor(Math.random() * dailyBonusRewards.length)];
}

function claimDailyBonus(){
    if(dailyBonusClaimed) return;
    if(!getAllQuestCompleted()) return;
    
    const bonus = getRandomDailyBonus();
    money += bonus.reward;
    dailyBonusClaimed = true;
    
    updateMoney();
    localStorage.setItem("money", money);
    localStorage.setItem("dailyBonusClaimed", "true");
    
    statusText.innerText = "🎁 " + bonus.name + " 획득!";
    
    setTimeout(() => {
        openQuestMenu();
    }, 500);
}

function tryUpgradeRod(){

    const rod = getRod();
    const level = rod.level;
    const upgradeCost = upgradeCostFormula(level);
    const successRate = successRateFormula(level);
    const failRate = 100 - successRate;

    if(money < upgradeCost){
        statusText.innerText = "💰 돈이 부족합니다!";
        return;
    }

    money -= upgradeCost;
    updateMoney();
    localStorage.setItem("money", money);

    const roll = Math.random() * 100;

    if(roll < successRate){
        // 업그레이드 성공
        setRodLevel(currentRod, level + 1);
        statusText.innerText = "✓ " + rods.find(r => r.id === currentRod).name + " LV." + (level + 1) + " 업그레이드 성공!";
        
        const rod2 = getRod();
        nowrod.innerText = rod2.name;
    } else {
        // 업그레이드 실패 - 레벨 1 감소
        const newLevel = Math.max(1, level - 1);
        setRodLevel(currentRod, newLevel);
        statusText.innerText = "❌ 업그레이드 실패! 레벨이 " + newLevel + "으로 내려갔습니다.";
        
        const rod2 = getRod();
        nowrod.innerText = rod2.name;
    }

    openUpgradeMenu();
}

function addQuestProgress(type,amount=1){

    quests.forEach(q => {

        if(q.type !== type) return;

        if(!questProgress[q.id]){

            questProgress[q.id] = 0;
        }

        questProgress[q.id] += amount;
    });

    localStorage.setItem(
        "questProgress",
        JSON.stringify(questProgress)
    );
}

function claimQuest(id){

    const quest =
    quests.find(q => q.id === id);

    if(!quest) return;

    const progress =
    questProgress[id] || 0;

    if(progress < quest.goal) return;
    if(questClaimed[id]) return;

    money += quest.reward;
    questClaimed[id] = true;

    localStorage.setItem(
        "money",
        money
    );
    localStorage.setItem(
        "questClaimed",
        JSON.stringify(questClaimed)
    );

    updateMoney();
    openQuestMenu();
}

function openQuestMenu(){

    showPanel("questPanel");

    let html = "";

    quests.forEach(q => {

        const progress =
        questProgress[q.id] || 0;

        const done =
        progress >= q.goal;
        const claimed =
        questClaimed[q.id] === true;

        let className = "questEntry";
        if(done) className += " completed";
        if(claimed) className += " claimed";

        const barWidth = Math.min((progress / q.goal) * 100, 100);

        html += `
        <div class="${className}">
            <h3 style="margin:0 0 10px 0; color:#333;">${q.title}</h3>
            <p style="margin:5px 0; color:#666;">${q.desc}</p>
            <div class="questProgressBar" style="width:${barWidth}%;">
                ${Math.min(progress,q.goal)} / ${q.goal}
            </div>
            <p style="margin:8px 0; color:#888;">💰 보상: ${q.reward}G</p>
        `;

        if(done){
            if(claimed){
                html += `
                <button disabled style="background:#94a3b8; color:white; border:none; padding:8px 16px; border-radius:8px; width:100%; margin-top:8px; cursor:not-allowed;">
                    🗹 보상 수령 완료
                </button>
                `;
            } else {
                html += `
                <button onclick="claimQuest('${q.id}')" style="background:#4ade80; color:white; border:none; padding:8px 16px; border-radius:8px; cursor:pointer; width:100%; margin-top:8px;">
                    ✓ 보상 받기
                </button>
                `;
            }
        }

        html += `</div>`;
    });

    document.getElementById("questList").innerHTML = html;

    // 모든 퀘스트 완료 체크
    const allCompleted = getAllQuestCompleted();
    const bonusInfo = document.getElementById("allQuestsBonusInfo");
    
    if(allCompleted && !dailyBonusClaimed){
        bonusInfo.style.display = "block";
        const bonus = getRandomDailyBonus();
        document.getElementById("bonusRewardText").innerText = bonus.name + " 획득!";
    } else {
        bonusInfo.style.display = "none";
    }
}

    let html = "";

    rods.forEach((baseRod) => {

        const level = getRodLevel(baseRod.id);
        const upgradeCost = upgradeCostFormula(level);
        const successRate = successRateFormula(level);

        const isEquipped = currentRod === baseRod.id;

        html += `
        <div class="regionEntry" style="opacity: ${isEquipped ? 1 : 0.6}">
            <h3>${baseRod.name} LV.${level}</h3>
            <p style="margin:8px 0; color:#999;">현재 레벨: LV.${level}</p>
            
            <div style="margin:12px 0; padding:12px; background:#f0f0f0; border-radius:8px; color:#333;">
                <p style="margin:5px 0;"><b>업그레이드 비용:</b> 💰 ${upgradeCost}G</p>
                <p style="margin:5px 0;"><b>성공 확률:</b> <span style="color:#4ade80;">${successRate}%</span></p>
                <p style="margin:5px 0;"><b>실패 시:</b> <span style="color:#ff6b6b;">레벨 -1</span></p>
            </div>
        `;

        if(isEquipped){
            html += `<button onclick="tryUpgradeRod()" style="background:#fbbf24; color:#333; padding:10px 20px; border:none; border-radius:8px; cursor:pointer; width:100%; font-weight:bold;">
                🔧 업그레이드 시도
            </button>`;
        } else {
            html += `<p style="color:#999; text-align:center;">장착 필요</p>`;
        }

        html += `</div>`;
    });

    document.getElementById("upgradeContent").innerHTML = html;
}
